services:
  belveb-ai:
    #build:
    #  context: .
    #  args:
    #    USE_CUDA: "true"
    #    USE_SLIM: "true"
    image: bveb-open-webui_belveb-ai:latest
    container_name: belveb-ai
    volumes:
      - open-webui:/app/backend/data
      - /home/ian/Projects/all-MiniLM-L6-v2:/app/models/all-MiniLM-L6-v2:ro
    ports:
      - "${OPEN_WEBUI_PORT-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_NAME=БелВЭБ Ai
      - WEBUI_SECRET_KEY=
      - HF_PROXY=${HF_PROXY:-}
      - RAG_EMBEDDING_MODEL=/app/models/all-MiniLM-L6-v2
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_FULL_CONTEXT_MAX_CHARS=100000
      - CHUNK_SIZE=5000
      - RAG_TOP_K=50
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
